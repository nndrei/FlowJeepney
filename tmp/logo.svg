<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" width="800" height="720" fill="none">
  <defs>
    <!-- Van Gradients -->
    <linearGradient id="vanRedGrad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#E51E2B" />
      <stop offset="100%" stop-color="#C4121F" />
    </linearGradient>
    <linearGradient id="windshieldDark" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#283344" />
      <stop offset="60%" stop-color="#182230" />
      <stop offset="100%" stop-color="#0E1622" />
    </linearGradient>
    <filter id="carGroundGlow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur stdDeviation="4.5" />
    </filter>
  </defs>

  <!-- ============================================== -->
  <!-- 1. VEHICLE ICON                                -->
  <!-- ============================================== -->
  <g transform="translate(18, 10)">
    <!-- Ground Shadow -->
    <ellipse cx="232" cy="222" rx="72" ry="7" fill="#94A3B8" opacity="0.32" filter="url(#carGroundGlow)" />
    <ellipse cx="234" cy="222" rx="54" ry="4.5" fill="#64748B" opacity="0.22" />

    <!-- 5 Speed Streaks on Left (Red) -->
    <g fill="#E51E2B">
      <!-- Streak 1: Roofline -->
      <rect x="120" y="74" width="46" height="11" rx="5.5" />
      <!-- Streak 2: Upper Window -->
      <rect x="88" y="99" width="76" height="11.5" rx="5.75" />
      <!-- Streak 3: Mid-beltline (Detached dot + trail) -->
      <rect x="45" y="125" width="22" height="12" rx="6" />
      <rect x="80" y="125" width="82" height="12" rx="6" />
      <!-- Streak 4: Lower Door -->
      <rect x="74" y="151" width="76" height="11.5" rx="5.75" />
      <!-- Streak 5: Bottom Bumper Accent -->
      <rect x="120" y="174" width="26" height="9.5" rx="4.75" />
    </g>

    <!-- Aerodynamic Roof Dome (Red) -->
    <path
      d="M165 110C165 62 188 42 236 42H262C296 42 308 58 308 86V108H165V110Z"
      fill="url(#vanRedGrad)"
    />
    <!-- Roof Specular Shine Highlight -->
    <ellipse
      cx="205"
      cy="56"
      rx="15"
      ry="6"
      transform="rotate(-20 205 56)"
      fill="#FFFFFF"
      opacity="0.95"
    />

    <!-- White Cabin Outer Shell (A-pillars, door frame & nose) -->
    <path
      d="M162 106H308C314 106 317 110 317 116L311 178C310 187 303 194 293 194H172C164 194 158 187 158 178V116C158 110 162 106 162 106Z"
      fill="#FFFFFF"
      stroke="#E2E8F0"
      stroke-width="1.5"
    />
    <!-- Rear Cabin Pillar Red Accent -->
    <path d="M158 108H167V182H161C159 182 158 180 158 177V108Z" fill="#E51E2B" />

    <!-- Driver Side Window (Dark tinted with rounded corner) -->
    <path
      d="M176 86C176 80 180 76 186 76H201C204 76 206 78 206 81V116H176V86Z"
      fill="#1A2332"
    />
    <rect x="180" y="92" width="4" height="13" rx="2" fill="#94A3B8" opacity="0.6" />

    <!-- Panoramic Front Windshield (Deep curved angled glass) -->
    <path
      d="M214 72C214 68 218 66 222 66H294C299 66 302.5 69.5 301 75L290.5 125C289 128.5 286 131 282 131H216C213 131 211 128.5 212 125L214 72Z"
      fill="url(#windshieldDark)"
    />
    <!-- Windshield Diagonal Gloss Reflections -->
    <path d="M228 72L244 72L234 126L220 126L228 72Z" fill="#FFFFFF" opacity="0.14" />
    <path d="M252 72L262 72L253 126L245 126L252 72Z" fill="#FFFFFF" opacity="0.08" />

    <!-- White Front Nose / Hood (Directly below windshield) -->
    <path
      d="M210 133H292C299 133 303 137.5 302 144L297.5 178C296.5 184 292.5 187 287 187H208C203 187 200 184 200 178V143C200 137.5 204 133 210 133Z"
      fill="#FFFFFF"
    />

    <!-- Headlights (Angled teardrop/almond shapes) -->
    <!-- Left Headlight -->
    <path
      d="M215 152C221 150.5 228 155 236 166C229 170 221 170 214 167C211 164.5 211 159 212.5 156C213 154 214 152.5 215 152Z"
      fill="#0F172A"
    />
    <circle cx="223" cy="160" r="3.2" fill="#38BDF8" opacity="0.75" />
    <circle cx="222" cy="159" r="1.4" fill="#FFFFFF" />

    <!-- Right Headlight with Glowing Amber Projector Bulb -->
    <path
      d="M280 152C287 156 290 160.5 291.5 166C285 169 277 167.5 270 163.5C273 158 276 153.5 280 152Z"
      fill="#0F172A"
    />
    <circle cx="282.5" cy="160" r="4.6" fill="#F59E0B" />
    <circle cx="282.5" cy="160" r="2" fill="#FEF3C7" />

    <!-- Lower Bumper (Red) -->
    <path
      d="M158 184H294C299 184 301 187.5 299.5 192L297 199C295 204 291 207 286 207H165C160 207 157 203.5 156.5 199L156 190C155 186 158 184 158 184Z"
      fill="url(#vanRedGrad)"
    />

    <!-- White License Plate Slot -->
    <rect
      x="234"
      y="186"
      width="42"
      height="10.5"
      rx="4"
      fill="#FFFFFF"
      stroke="#0F172A"
      stroke-width="1.5"
    />

    <!-- Front Left Wheel & Rim -->
    <ellipse cx="192" cy="204" rx="14" ry="18" fill="#0F172A" />
    <ellipse cx="192" cy="204" rx="7.5" ry="9.5" fill="#FFFFFF" />
    <circle cx="192" cy="204" r="3" fill="#64748B" />

    <!-- Right Rear Wheel Peeking -->
    <ellipse cx="274" cy="207" rx="10" ry="7" fill="#1E293B" />
  </g>

  <!-- ============================================== -->
  <!-- 2. BRAND NAME TYPOGRAPHY: FlowJeep             -->
  <!-- ============================================== -->
  <g id="brand-text">
    <text
      x="200"
      y="298"
      text-anchor="middle"
      font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
      font-size="64"
      font-weight="800"
      letter-spacing="-2"
    >
      <tspan fill="#111827">Flow</tspan><tspan fill="#E51E2B">Jeep</tspan>
    </text>
  </g>
</svg>
