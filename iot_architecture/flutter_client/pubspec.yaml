name: flowjeep_commuter_app
description: "Cross-platform Flutter application for real-time paratransit tracking, occupancy monitoring, and ETA prediction."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.27.0
  firebase_database: ^10.4.9
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  provider: ^6.1.1
  http: ^1.2.0
  intl: ^0.19.0
  lucide_icons: ^0.257.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
