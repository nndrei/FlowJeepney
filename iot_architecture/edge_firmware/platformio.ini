; PlatformIO Project Configuration File for FlowJeep ESP32-S3 Edge Node
[env:esp32-s3-devkitc-1]
platform = espressif32 @ 6.5.0
board = esp32-s3-devkitc-1
framework = arduino

; Optimize CPU & Flash for real-time sensor processing and OV2640 camera capture
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = default_8MB.csv

; Enable Octal PSRAM for camera frame buffers and CV processing
board_build.arduino.memory_type = qio_opi
build_flags = 
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=3

monitor_speed = 115200
upload_speed = 921600

lib_deps = 
    bblanchon/ArduinoJson @ ^6.21.3
    mikalhart/TinyGPSPlus @ ^1.0.3
    vshymanskyy/TinyGSM @ ^0.11.7
    knolleary/PubSubClient @ ^2.8
